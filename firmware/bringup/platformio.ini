; Hardware bring-up for the main ESP32 (not the product firmware).
; Checks every module on the wiring table and prints the result over USB.
;
;   python -m platformio run -t upload      ; build + flash
;   python -m platformio device monitor     ; watch the output (Ctrl+C to quit)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800
build_flags = -I../main-esp32/include
