; ESP32-CAM (AI-Thinker) - capture server for the main ESP32 (spec 5.3.11, Appendix E.1.1).
;
;   python -m platformio run -t upload --upload-port COMx   ; GPIO0 to GND while flashing
;   python -m platformio device monitor --port COMx

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800
; secrets.h (device code, camera secret, AP password) is shared with the main
; board and generated by the seed / device:provision - never committed.
build_flags =
  -I../main-esp32/include
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
