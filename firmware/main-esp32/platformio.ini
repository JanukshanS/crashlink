; CrashLink main ESP32 firmware (spec 4.5.1, 5.3, Appendix E / E.1).
;
;   python -m platformio run -t upload --upload-port COMx
;   python -m platformio device monitor --port COMx
;
; include/secrets.h (device identity) and include/network.h (transport, Wi-Fi,
; API base) are gitignored. See include/network.example.h.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = direct
upload_speed = 460800
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  mikalhart/TinyGPSPlus@^1.1.0
